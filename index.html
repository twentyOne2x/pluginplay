<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; frame-src https://kino-der-toten.pages.dev https://moon-zombies.pages.dev https://pes6.optijuegos.net https://pixelsuft.github.io https://pocket-aces.anshu.dev https://q1.pieter.com https://q2.pieter.com https://q3.pieter.com https://rtcw.pieter.com https://skate.aaddpp.lol https://twentyone2x.github.io https://ut.pieter.com https://vibeslops.luckeysystems.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>PluginPlay</title><style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  color: #f5f3ec;
  background: #101410;
  color-scheme: dark;
  --host-height: 100dvh;
  --safe-top: 0px;
  --safe-bottom: 0px;
  --safe-left: 0px;
  --safe-right: 0px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
a {
  font: inherit;
}
button,
a.button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
}
a {
  color: inherit;
}
#app {
  max-height: var(--host-height);
  overflow-y: auto;
  padding: calc(28px + var(--safe-top)) 28px calc(28px + var(--safe-bottom));
  scrollbar-gutter: stable;
}
.masthead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 26px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.19em;
  color: #b6cd84;
  font-weight: 700;
}
h1 {
  font-size: clamp(30px, 6vw, 54px);
  letter-spacing: -0.065em;
  line-height: 1.1;
  margin: 12px 0;
}
.dot {
  color: #b6cd84;
}
.intro {
  color: #a7afa2;
  font-size: 14px;
  margin: 0;
}
.count {
  font-size: 12px;
  white-space: nowrap;
  color: #b6cd84;
  padding: 9px 12px;
  border: 1px solid #445138;
  border-radius: 30px;
}
#status {
  font-size: 13px;
  color: #c2cdb8;
  line-height: 1.55;
  margin: 0 0 16px;
}
#status:empty {
  display: none;
}
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.tile {
  text-align: left;
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 211px;
  padding: 18px;
  background: linear-gradient(145deg, var(--tile-color), #1a211b 83%);
  border: 1px solid #ffffff12;
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition:
    transform 0.15s,
    border-color 0.15s;
  overflow: hidden;
}
.tile:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: #b6cd8477;
}
.tile-number {
  position: absolute;
  right: 16px;
  top: 14px;
  font-size: 10px;
  color: #d1dbc199;
  font-variant-numeric: tabular-nums;
  z-index: 1;
  background: #101410cc;
  padding: 3px 5px;
  border-radius: 4px;
}
.thumbnail {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 9px;
  background: linear-gradient(145deg, var(--tile-color), #1a211b 83%);
  margin-bottom: 16px;
}
.thumbnail-image {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.selected-thumbnail {
  max-width: 480px;
}
.initials {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: #ffffff0d;
  border: 1px solid #ffffff16;
  display: grid;
  place-items: center;
  font-size: 18px;
  letter-spacing: -0.06em;
  font-weight: 700;
}
.tile strong {
  font-size: 15px;
  line-height: 1.35;
  margin-bottom: 11px;
}
.badge {
  align-self: start;
  font-size: 10px;
  background: #ffffff12;
  border-radius: 5px;
  padding: 4px 7px;
}
.destination {
  font-size: 11px;
  color: #aab5a4;
  margin-top: auto;
  padding-top: 10px;
}
.phone {
  letter-spacing: 0.08em;
  margin-top: 8px;
}
.device-notice {
  flex: 0 0 auto;
  margin: 0 0 6px;
  font-size: 12px;
  color: #e3cf9d;
}
.tile:disabled {
  opacity: 0.55;
}
.unavailable {
  color: #dbb2a4;
}
.mismatch {
  font-size: 10px;
  color: #e3cf9d;
  margin-top: 8px;
}
.rail {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.rail h2 {
  font-size: 18px;
  flex: 1;
  min-width: 140px;
  margin: 0;
}
.button {
  display: inline-block;
  border: 1px solid #4c5a40;
  border-radius: 8px;
  background: #263020;
  padding: 9px 12px;
  font-size: 12px;
  text-decoration: none;
  color: #e7eddf;
}
.button:hover {
  background: #35412c;
}
.frame-wrap {
  width: 100%;
  min-height: 240px;
  overflow: hidden;
  border: 1px solid #3b4534;
  border-radius: 10px;
  background: #000;
}
iframe {
  border: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.notice {
  color: #e3cf9d;
  font-size: 13px;
}
.requirement {
  font-size: 12px;
  color: #aab5a4;
}
button:focus-visible,
a:focus-visible {
  outline: 3px solid #cfed9d;
  outline-offset: 3px;
}
:root [hidden],
#grid[hidden],
#player[hidden],
.masthead[hidden] {
  display: none;
}
@media (max-width: 460px) {
  #app {
    padding: 18px 14px;
  }
  #grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }
  .tile {
    min-height: 196px;
    padding: 13px;
  }
  .tile strong {
    font-size: 13px;
  }
  .masthead {
    gap: 8px;
  }
  .count {
    padding: 7px 9px;
  }
  .frame-wrap {
    min-height: 220px;
  }
  .rail h2 {
    flex-basis: 100%;
    order: -1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tile {
    transition: none;
  }
  .tile:hover {
    transform: none;
  }
}
body.playing #app {
  height: var(--host-height);
  max-height: var(--host-height);
  overflow: hidden;
  padding: calc(6px + var(--safe-top)) calc(6px + var(--safe-right))
    calc(6px + var(--safe-bottom)) calc(6px + var(--safe-left));
  display: flex;
  flex-direction: column;
  scrollbar-gutter: auto;
}
body.playing #status {
  margin: 0 0 6px;
}
body.playing #player {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
body.playing .rail {
  flex: 0 0 auto;
  margin-bottom: 6px;
  gap: 8px;
}
body.playing .rail h2 {
  font-size: 15px;
}
body.playing .frame-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 0;
  border-radius: 6px;
}
body.playing .frame-wrap iframe {
  position: absolute;
  inset: 0;
}
.check {
  border-collapse: collapse;
  font-size: 12px;
  margin: 12px 0;
}
.check th {
  text-align: left;
  padding: 4px 14px 4px 0;
  color: #aab5a4;
  font-weight: 500;
  vertical-align: top;
}
.check td {
  padding: 4px 0;
  word-break: break-word;
}
.check-result {
  font-size: 13px;
}
/* Contain gestures on every owned playing surface, including the frame
   element. The cross-origin game's document controls its own gestures. */
html:has(body.playing),
body.playing {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
}
body.playing * {
  touch-action: none;
  overscroll-behavior: none;
}
.play-gesture {
  position: absolute;
  inset: 0;
  z-index: 1;
  border: 0;
  background: #101410ee;
  color: inherit;
  font: inherit;
}
/* Use the host's safe area for its composer instead of guessing its height.
   Keep only the catalog back button over the game on phones. */
@media (pointer: coarse), (max-width: 760px) {
  body.playing #app {
    padding: var(--safe-top) var(--safe-right) var(--safe-bottom)
      var(--safe-left);
  }
  body.playing #status {
    position: absolute;
    top: calc(36px + var(--safe-top));
    left: calc(6px + var(--safe-left));
    right: calc(6px + var(--safe-right));
    z-index: 2;
    pointer-events: none;
    margin: 0;
  }
  body.playing .rail {
    position: absolute;
    top: calc(6px + var(--safe-top));
    left: calc(6px + var(--safe-left));
    z-index: 2;
    margin: 0;
  }
  body.playing .rail > :not(:first-child) {
    display: none;
  }
  body.playing .rail .button {
    padding: 5px 9px;
    font-size: 11px;
    background: #101410cc;
  }
  body.playing .frame-wrap {
    border-radius: 0;
  }
}
